services:
  mongo:
    image: mongo:7
    # A replica set is required for j:true / w:majority semantics and transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/init-replica-set.js:/init-replica-set.js:ro
    command: ["mongosh", "--host", "mongo", "--quiet", "--file", "/init-replica-set.js"]
    restart: "no"

  app:
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      # Inside the compose network the database is "mongo"; directConnection skips replica-set
      # discovery, which would hand back the member host "localhost:27017" set by the init script.
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    # Gives the worker time to drain in-flight batches (~5s each) after SIGTERM.
    stop_grace_period: 30s

volumes:
  mongo-data:
